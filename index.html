<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韦特塔罗 · 78张学习笔记</title>
<style>
  :root{
    --bg:#100d18; --bg2:#171126; --panel:#1d1730; --panel2:#241b3a;
    --gold:#d6af5b; --gold2:#f0d59a; --ink:#e9e2d6; --muted:#a89fb8;
    --line:#332a4d; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.6;
    background-image:
      radial-gradient(1200px 600px at 20% -10%, rgba(88,60,140,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, rgba(120,80,180,.12), transparent 55%),
      radial-gradient(900px 700px at 50% 110%, rgba(60,70,120,.15), transparent 60%);
    background-attachment:fixed;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px}
  header.tit{text-align:center;padding:34px 10px 10px}
  .stars{color:var(--gold2);letter-spacing:6px;font-size:13px;opacity:.9}
  h1{font-size:30px;font-weight:700;margin:8px 0 4px;letter-spacing:2px;
     background:linear-gradient(180deg,#f5e6bd,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13.5px}
  .ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:24px 0 8px}
  .input{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    padding:9px 14px;font-size:14px;width:230px;outline:none
  }
  .input:focus{border-color:var(--gold)}
  select.input{width:auto;cursor:pointer}
  .btn{
    background:linear-gradient(180deg,#e6c477,var(--gold));color:#2a1f08;border:none;border-radius:12px;
    padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(214,175,91,.25);transition:.2s
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold2);box-shadow:none;font-weight:500}
  .gtabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 6px}
  .gtab{padding:7px 15px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font-size:13.5px;cursor:pointer;transition:.2s}
  .gtab.on{background:linear-gradient(180deg,rgba(214,175,91,.25),rgba(214,175,91,.08));color:var(--gold2);border-color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;
    cursor:pointer;transition:.18s;display:flex;flex-direction:column;align-items:center;position:relative
  }
  .card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:var(--shadow)}
  .card img{width:100%;border-radius:6px;display:block;aspect-ratio:3/5;object-fit:cover;background:#0a0811}
  .card .nm{font-size:13px;margin-top:7px;font-weight:600;text-align:center}
  .card .en{font-size:10.5px;color:var(--muted);text-align:center;margin-top:1px}
  .sectitle{font-size:19px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  .sectitle .dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 10px currentColor}
  .ovl{position:fixed;inset:0;background:rgba(8,6,14,.78);backdrop-filter:blur(4px);display:none;
    align-items:center;justify-content:center;z-index:9999;padding:20px}
  .ovl.on{display:flex}
  .modal{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:18px;
    max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow);padding:24px;position:relative;animation:pop .25s}
  @keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
  .m-body{display:flex;gap:20px;align-items:flex-start}
  .m-img{flex:0 0 168px}
  .m-img img{width:100%;border-radius:10px;box-shadow:var(--shadow)}
  .m-info{flex:1;min-width:0}
  .m-info h2{font-size:22px;letter-spacing:1px}
  .m-info .en{color:var(--gold2);font-size:13px;margin:2px 0 8px}
  .m-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .m-tags span{font-size:11.5px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);color:var(--gold2);background:rgba(214,175,91,.08)}
  .m-switch{display:flex;gap:8px;margin:6px 0 10px}
  .m-switch button{flex:1;padding:7px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
  .m-switch button.on{background:rgba(214,175,91,.2);color:var(--gold2);border-color:var(--gold)}
  .m-mean{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14px;color:var(--ink)}
  .m-mean b{color:var(--gold2);display:block;margin-bottom:4px;font-size:13px}
  .quiz{max-width:420px;margin:30px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 20px}
  .quiz h3{color:var(--gold2);font-size:17px;margin-bottom:6px}
  .quiz .qh{color:var(--muted);font-size:13px;margin-bottom:16px}
  .qcard{width:150px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);position:relative}
  .qcard img{width:100%;display:block}
  .qcard .backk{aspect-ratio:3/5;display:flex;align-items:center;justify-content:center;background:
    repeating-linear-gradient(45deg,#2b2140,#2b2140 10px,#33284d 10px,#33284d 20px);color:var(--gold);font-size:28px;letter-spacing:2px}
  .qresult{margin-top:16px;min-height:60px}
  .qresult .qn{font-size:17px;font-weight:700;color:var(--gold2)}
  .qresult .qm{font-size:13.5px;margin-top:6px;color:var(--ink)}
  .qbtns{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .dvcard{width:58px;aspect-ratio:3/5;border-radius:6px;cursor:pointer;transition:.15s;
    background:repeating-linear-gradient(45deg,#2b2140,#2b2140 6px,#33284d 6px,#33284d 12px);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:16px}
  .dvcard:hover{transform:translateY(-4px);border-color:var(--gold)}
  .dvcard.picked{opacity:.25;cursor:default;transform:none}
  .dv-slot{flex:1;min-width:140px;text-align:center;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:12px;padding:12px}
  .dv-slot img{width:110px;border-radius:8px;margin:0 auto;display:block;box-shadow:var(--shadow)}
  .dv-slot img.rev{transform:rotate(180deg)}
  .dv-pos{font-size:12px;color:var(--gold2);margin:8px 0 4px;letter-spacing:1px}
  .dv-nm{font-size:15px;font-weight:700}
  .dv-or{font-size:11px;color:var(--muted)}
  .dv-mn{font-size:12.5px;color:var(--ink);margin-top:6px;text-align:left;line-height:1.55}
  .dv-sum{margin-top:14px;background:rgba(214,175,91,.08);border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.7}
  .shuffling{animation:shf .4s infinite}
  @keyframes shf{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(3deg)}100%{transform:translateY(0) rotate(0)}}
    /* 扇形牌阵 */
  .fan-wrap{position:relative;height:300px;margin:10px 30px;overflow:hidden;user-select:none;display:flex;justify-content:center;align-items:flex-end}
  .wheel-card{position:absolute;left:50%;top:50%;width:60px;aspect-ratio:3/5;border-radius:5px;cursor:pointer;
    background:repeating-linear-gradient(45deg,#2b2140,#2b2140 5px,#33284d 5px,#33284d 10px);
    border:1px solid #4a3d6e;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;
    box-shadow:0 4px 12px rgba(0,0,0,.5);transition:filter .2s}
  .wheel-card .wnum{font-size:11px;color:var(--gold2);opacity:.8;font-weight:600}
  .wheel-card:hover{filter:brightness(1.4);border-color:var(--gold)}
  .wheel-card.picked{opacity:.12;pointer-events:none}
  .dv-slots{display:flex;gap:16px;justify-content:center;margin:16px 0;flex-wrap:wrap;min-height:180px}
  .dv-slot{width:130px;text-align:center;background:rgba(0,0,0,.15);border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:195px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .dv-slot.filled{border-style:solid;border-color:var(--gold);background:rgba(214,175,91,.06)}
  .dv-slot img{width:110px;border-radius:8px;box-shadow:var(--shadow)}
  .dv-slot img.rev{transform:rotate(180deg)}
  .counter{font-size:22px;font-weight:700;color:var(--gold2);text-align:center;margin:8px 0}
  @media(max-width:600px){
    .fan-wrap{height:320px}
    .fan-card{width:55px;font-size:11px;bottom:20px}
    .dv-slot{width:95px;min-height:150px}
    .dv-slot img{width:85px}
  }
  .empty{text-align:center;color:var(--muted);padding:60px 10px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;opacity:.7}
  .countline{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="tit">
    <div class="stars">✦ &nbsp;☽&nbsp; ✦</div>
    <h1>韦特塔罗 · 78张学习笔记</h1>
    <div class="sub">标准分类 · 单张牌面详解 · 正逆位 · 抽牌自测 · 三牌阵占卜</div>
  </header>


  <!-- 顶部Tab切换 -->
  <div style="display:flex;gap:12px;justify-content:center;margin:16px 0 20px">
    <button id="tabLib" onclick="switchTab('lib')" style="padding:10px 32px;border-radius:25px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),#b8943f);color:#1a1025">📚 牌库图鉴</button>
    <button id="tabDiv" onclick="switchTab('div')" style="padding:10px 32px;border-radius:25px;border:1px solid var(--line);font-size:15px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted)">🔮 开始占卜</button>
  </div>

  <div class="ctrl" id="ctrlBar">
    <input id="search" class="input" placeholder="🔍 搜牌名 / 关键词，如：工作、面试、恋人…">
    <select id="suitFilter" class="input">
      <option value="">全部元素</option>
      <option value="大阿卡纳">大阿卡纳</option>
      <option value="土">土 · 星币</option>
      <option value="水">水 · 圣杯</option>
      <option value="风">风 · 宝剑</option>
      <option value="火">火 · 权杖</option>
    </select>
    <button id="aiCfgBtn" class="btn ghost">⚙️ AI 配置</button>
  </div>


  <!-- 牌库区 -->
  <div id="libView">
  <div id="stdTabs" class="gtabs"></div>
  <div id="countLine" class="countline"></div>
  <div id="grid" class="grid"></div>
  </div>

  <!-- 占卜区 -->
  <div id="divView" style="display:none">
  <div class="quiz" id="divBox" style="max-width:760px">
    <h3>🔮 三牌阵 · 现状 / 阻碍 / 建议</h3>
    <div class="qh">心里默念你的问题，从扇形牌堆里凭直觉点三张</div>
    <input id="dvQ" class="input" style="width:100%;margin-bottom:14px" placeholder="">
    <div class="counter" id="dvCount">0 / 3 已选</div>
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px">👆 左右拖动牌轮 · 凭直觉点击选牌</div>
    <div style="text-align:center;margin-bottom:10px;display:flex;gap:10px;justify-content:center"><button id="dvShuffle" class="btn">🃏 洗牌</button><button id="dvHistBtn" class="btn ghost">📜 历史记录</button></div>
    <div class="fan-wrap" id="dvDeck"></div>
    <div class="dv-slots" id="dvSlots">
      <div class="dv-slot" data-pos="0"><div style="font-size:12px;color:var(--muted)">现状</div></div>
      <div class="dv-slot" data-pos="1"><div style="font-size:12px;color:var(--muted)">阻碍</div></div>
      <div class="dv-slot" data-pos="2"><div style="font-size:12px;color:var(--muted)">建议</div></div>
    </div>
    <div id="dvResult" style="margin-top:16px;text-align:left"></div>
  </div>


  <footer style="margin-top:30px">

    ✧ 韦特塔罗学习笔记 · 卡牌图源 <a href="https://github.com/mixvlad/TarotCards" target="_blank" style="color:var(--gold2)">GitHub: mixvlad/TarotCards</a>（公版 MIT）✧
  </footer>
</div>

<!-- modal -->
<div class="ovl" id="ovl">
  <div class="modal" id="modal">
    <button class="close" id="closeModal">×</button>
    <div class="m-body">
      <div class="m-img"><img id="mImg" alt=""></div>
      <div class="m-info">
        <h2 id="mName"></h2>
        <div class="en" id="mEn"></div>
        <div class="m-tags" id="mTags"></div>
        <div class="m-switch">
          <button id="swUpr" class="on">正位</button>
          <button id="swRev">逆位</button>
        </div>
        <div class="m-mean" id="mMean"></div>
        <div class="m-mean" id="mPic" style="margin-top:10px"></div>
      </div>
    </div>
  </div>
</div>

<!-- AI config modal -->
<div class="ovl" id="aiOvl">
  <div class="modal" style="max-width:480px">
    <button class="close" id="aiClose">×</button>
    <h2 style="color:var(--gold2);margin-bottom:4px">⚙️ AI 配置</h2>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">
      🔒 Key 只存在你自己浏览器里（localStorage），不会上传到服务器。每个网站独立存储，别人访问 tarot-learner.pages.dev 看不到你的 Key。
    </div>
    <label style="font-size:13px;color:var(--muted)">选择服务商（自动填好地址和模型）</label>
    <select id="aiPreset" class="input" style="width:100%;margin:4px 0 12px">
      <option value="local">🏠 本地服务器（推荐，不用VPN）</option>
      <option value="glm">智谱 GLM（OpenAI兼容）</option>
      <option value="glm_anthropic">智谱 GLM（Anthropic格式，推荐）</option>
      <option value="deepseek">DeepSeek（性价比高）</option>
      <option value="qwen">通义千问 DashScope</option>
      <option value="openai">OpenAI 官方</option>
      <option value="moonshot">Moonshot 月之暗面</option>
      <option value="anthropic">Anthropic Claude 官方</option>
      <option value="custom">自定义（OpenAI 兼容格式）</option>
      <option value="custom_ant">自定义（Anthropic 格式）</option>
    </select>
    <label style="font-size:13px;color:var(--muted)">接口地址 Base URL</label>
    <input id="aiBase" class="input" style="width:100%;margin:4px 0 12px" placeholder="https://...">
    <label style="font-size:13px;color:var(--muted)">API Key</label>
    <input id="aiKey" type="password" class="input" style="width:100%;margin:4px 0 12px" placeholder="粘贴你的 Key">
    <label style="font-size:13px;color:var(--muted)">模型 Model</label>
    <input id="aiModel" class="input" style="width:100%;margin:4px 0 16px" placeholder="模型名">
    <div class="qbtns" style="justify-content:flex-start;margin-top:0">
      <button id="aiSave" class="btn">保存配置</button>
      <button id="aiCancel" class="btn ghost">取消</button>
      <button id="aiClear" class="btn ghost">清除 Key</button>
    </div>
    <div id="aiStatus" style="margin-top:12px;font-size:12.5px;color:var(--gold2)"></div>
  </div>
</div>

<script>
function switchTab(t){
  document.getElementById('libView').style.display=t==='lib'?'':'none';
  document.getElementById('divView').style.display=t==='div'?'':'none';
  var active='linear-gradient(135deg,var(--gold),#b8943f)', inactive='transparent';
  var ac='#1a1025', ic='var(--muted)';
  document.getElementById('tabLib').style.background=t==='lib'?active:inactive;
  document.getElementById('tabLib').style.color=t==='lib'?ac:ic;
  document.getElementById('tabLib').style.border=t==='lib'?'none':'1px solid var(--line)';
  document.getElementById('tabDiv').style.background=t==='div'?active:inactive;
  document.getElementById('tabDiv').style.color=t==='div'?ac:ic;
  document.getElementById('tabDiv').style.border=t==='div'?'none':'1px solid var(--line)';
  document.getElementById("ctrlBar").style.display=t==="lib"?"flex":"none"; if(t==="div" && document.querySelectorAll(".wheel-card").length===0){setTimeout(function(){dvShuffleDeck(); setTimeout(function(){dvRenderWheel();},600);},300);}
  window.scrollTo({top:0}); setTimeout(function(){window.dispatchEvent(new Event('resize'));},400);
}

/* ================= 数据 ================= */
/* f=文件名  n=中文  e=英文  s=花色  el=元素  u=正位  r=逆位  k=关键词 */

/* ================= 渲染 ================= */
const grid=document.getElementById('grid'), stdTabs=document.getElementById('stdTabs'),
      countLine=document.getElementById('countLine');
const suitFilter=document.getElementById('suitFilter'), search=document.getElementById('search');
let curStdFilter='all', curUpr=1, curCard=null;

const STD_SECTS=[['all','全部','#d6af5b'],['maj','大阿卡纳','#b487d6'],['pents','星币 · 土','#9c8a4a'],
  ['cups','圣杯 · 水','#6aa0c0'],['swords','宝剑 · 风','#8fb0b8'],['wands','权杖 · 火','#c96a5a']];
function renderStdTabs(){
  stdTabs.innerHTML=STD_SECTS.map(([k,t,col])=>
    `<button class="gtab ${k===curStdFilter?'on':''}" data-s="${k}">${t}</button>`).join('');
  stdTabs.querySelectorAll('.gtab').forEach(b=>b.onclick=()=>{curStdFilter=b.dataset.s;render();});
}

let cardNum=0;
function cardHTML(c){
  cardNum++;
  return `<div class="card" data-f="${c.f}">
    <div style="position:absolute;top:4px;left:6px;font-size:10px;color:var(--gold2);opacity:.7">${cardNum}</div>
    <img src="cards/${c.f}" alt="${c.n}" >
    <div class="nm">${c.n}</div><div class="en">${c.e}</div>
  </div>`;
}

function matches(c){
  const s=search.value.trim().toLowerCase();
  if(!s) return true;
  const hay=(c.n+c.e+c.u+c.r+(c.k||[]).join('')).toLowerCase();
  return hay.includes(s);
}

function render(){
  cardNum=0;
  renderStdTabs();
  let html='', total=0;
  grid.style.display='block';
  const order=[['maj','大阿卡纳','人生重大课题 · 关键转折','#b487d6'],
    ['pents','星币 · 土','物质 · 工作 · 资源','#9c8a4a'],
    ['cups','圣杯 · 水','情绪 · 人际 · 缘分','#6aa0c0'],
    ['swords','宝剑 · 风','思考 · 逻辑 · 压力 · 真相','#8fb0b8'],
    ['wands','权杖 · 火','行动 · 热情 · 机会 · 竞争','#c96a5a']];
  order.forEach(([s,t,desc,col])=>{
    if(curStdFilter!=='all' && curStdFilter!==s) return;
    let list=CARDS.filter(c=>c.s===s && matches(c));
    const el=suitFilter.value; if(el) list=list.filter(c=>c.el===el);
    if(!list.length) return;
    total+=list.length;
    html+=`<div class="sectitle"><span class="dot" style="color:${col};background:${col}"></span>${t}<span style="font-size:13px;color:var(--muted);font-weight:400;margin-left:8px">${desc} · ${list.length} 张</span></div><div class="grid">${list.map(cardHTML).join('')}</div>`;
  });
  if(!html){ grid.innerHTML='<div class="empty">没有匹配的牌，换个关键词试试～</div>'; countLine.textContent=''; return; }
  grid.innerHTML=html;
  countLine.textContent=`共 ${total} 张`;
  grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>openCard(el.dataset.f));
}

/* --- modal --- */
const ovl=document.getElementById('ovl'), modal=document.getElementById('modal');
function openCard(f){
  const c=CARDS.find(x=>x.f===f); if(!c)return;
  curCard=c; curUpr=1;
  document.getElementById('mImg').src='cards/'+c.f;
  document.getElementById('mName').textContent=c.n;
  document.getElementById('mEn').textContent=c.e;
  const tags=[c.el, ...(c.k||[])];
  document.getElementById('mTags').innerHTML=[...new Set(tags)].map(t=>`<span>${t}</span>`).join('');
  document.getElementById('mPic').innerHTML='<b>牌面画面</b>'+(PICS[c.f]||'');
  swUpr.classList.add('on');swRev.classList.remove('on');
  showMean();
  ovl.classList.add('on');
}
function showMean(){
  const m=document.getElementById('mMean');
  if(curUpr){ m.innerHTML=`<b>正位 · ${curCard.n}</b>${curCard.u}`; }

const dvDeck=document.getElementById('dvDeck'), dvResult=document.getElementById('dvResult'),
      dvShuffle=document.getElementById('dvShuffle'), dvCount=document.getElementById('dvCount');
let dvPicks=[];
const DV_POS=['现状','阻碍','建议'];
let dvRot=0, dvDragging=false, dvStartX=0, dvStartRot=0;

function dvShuffleDeck(){
  dvPicks=[]; dvResult.innerHTML=''; dvShuffle.textContent='🃏 重新洗牌';
  dvCount.textContent='0 / 3 已选';
  dvRot=0;
  document.querySelectorAll('.dv-slot').forEach((s,i)=>{
    s.classList.remove('filled');
    s.innerHTML='<div style="font-size:12px;color:var(--muted)">'+DV_POS[i]+'</div>';
  });
  dvDeck.innerHTML='';
  var cardPool=[...Array(78).keys()].sort(function(){return Math.random()-0.5});
  for(var i=0;i<78;i++){
    (function(posIdx,cardIdx){
      var c=document.createElement('div');
      c.className='wheel-card';
      c.innerHTML='<span class="wnum">'+(posIdx+1)+'</span>';
      c.dataset.card=cardIdx;
      c.onclick=function(){dvPick(c)};
      dvDeck.appendChild(c);
    })(i,cardPool[i]);
  }
  // Pile animation: cards start at center
  var cards=dvDeck.querySelectorAll('.wheel-card');
  var cx=dvDeck.offsetWidth/2, cy=dvDeck.offsetHeight/2;
  cards.forEach(function(c,i){
    c.style.left=(cx+(Math.random()-0.5)*80)+'px';
    c.style.top=(cy+(Math.random()-0.5)*50)+'px';
    c.style.transform='translate(-50%,-50%) rotate('+((Math.random()-0.5)*40)+'deg)';
  });
  // Fan out after 800ms
  setTimeout(function(){ dvRenderWheel(); dvDeck.style.opacity='1'; }, 800);
  setTimeout(function(){ dvRenderWheel(); }, 1600);
  // drag events
  dvDeck.onmousedown=function(e){dvDragging=true;dvStartX=e.clientX;dvStartRot=dvRot};
  window.onmousemove=function(e){
    if(!dvDragging)return;
    dvRot=dvStartRot+(e.clientX-dvStartX)*0.5;
    dvRenderWheel();
  };
  window.onmouseup=function(){dvDragging=false};
  dvDeck.ontouchstart=function(e){dvDragging=true;dvStartX=e.touches[0].clientX;dvStartRot=dvRot};
  dvDeck.ontouchmove=function(e){
    if(!dvDragging)return;
    dvRot=dvStartRot+(e.touches[0].clientX-dvStartX)*0.5;
    dvRenderWheel();
    e.preventDefault();
  };
  dvDeck.ontouchend=function(){dvDragging=false}; window.onresize=function(){if(document.querySelector('.wheel-card'))dvRenderWheel()};
}

function dvFanIn(cards){
  dvRot=0;
  setTimeout(function(){ dvRenderWheel(); }, 500); setTimeout(function(){ dvRenderWheel(); }, 1200);
}


function dvRenderWheel(){
  const cards=dvDeck.querySelectorAll('.wheel-card');
  const R=200;
  const cx=dvDeck.offsetWidth/2;
  const cy=dvDeck.offsetHeight+60;
  cards.forEach((c,i)=>{
    const angle=dvRot+i*(360/82);
    const rad=angle*Math.PI/180;
    const isPicked=c.classList.contains('picked');
    const lift=isPicked?-50:0;
    const rr=R+lift;
    c.style.left=(cx+Math.sin(rad)*rr)+'px';
    c.style.top=(cy-Math.cos(rad)*rr)+'px';
    c.style.transform='translate(-50%,-50%) rotate('+angle+'deg)';
    c.style.zIndex=isPicked?999:i;
    // number label at outer radius
    let num=c.querySelector('.wnum');
    if(!num){num=document.createElement('span');num.className='wnum';c.appendChild(num);}
    num.style.position='absolute';
    num.style.bottom='108%';
    num.style.left='50%';
    num.style.transform='translateX(-50%)';
    num.style.rotate=(-angle)+'deg';
  });
}

function dvPick(el, idx){
  if(el.classList.contains('picked')||dvPicks.length>=3) return;
  el.classList.add('picked');
  const card=CARDS[parseInt(el.dataset.card)];
  const upr=Math.random()<0.5?1:0;
  const pos=dvPicks.length;
  dvPicks.push({card, upr, pos});
  dvCount.textContent=`${dvPicks.length} / 3 已选`;
  // fill slot
  const slot=document.querySelector(`.dv-slot[data-pos="${pos}"]`);
  slot.classList.add('filled');
  slot.innerHTML=`<div style="font-size:12px;color:var(--gold2)">${DV_POS[pos]}</div>
    <img src="cards/${card.f}" class="${upr?'':'rev'}">
    <div style="font-size:13px;font-weight:700;margin-top:4px">${card.n}</div>
    <div style="font-size:10px;color:var(--muted)">${upr?'正位':'逆位'}</div>`;
  if(dvPicks.length===3) dvShowResult();
}

/* --- 一键复制AI解牌提示词 --- */
function dvBuildPrompt(){
  if(!dvPicks || dvPicks.length===0) return '';
  const q=document.getElementById('dvQ').value.trim()||'（用户未写具体问题，由解读师基于牌面给出普遍性指引）';
  const cardDesc=dvPicks.map((p,i)=>{
    const c=p.card;
    const mean=p.upr?c.u:c.r||'（逆位含义需结合上下文）';
    const key=(c.k&&c.k.length)?c.k.join('、'):'—';
    return `${i+1}. ${DV_POS[i]}｜${c.n} ${c.e}｜${p.upr?'正位':'逆位'}\n   关键词：${key}\n   牌义：${mean}`;
  }).join('\n\n');
  return `你是一位温和、清晰、尊重用户自主性的塔罗解读师。请只输出最终解读，不要展示思考过程，也不要用通用牌义替代对用户问题的回答。

【用户问题】
${q}

【牌阵】
三牌阵 · 现状 / 阻碍 / 建议（共 3 张牌）
牌阵用途：沿着事情的现状、阻碍与建议，看见一段连续的心理脉络。

【抽牌结果】
${cardDesc}

【本次解读的唯一焦点】
1. 先用一句话识别用户真正想解决的核心问题，区分它属于关系、工作、选择、自我状态还是其他类型；后续每一部分都必须围绕这个焦点。
2. 遵守问题中的对象、时间范围、情境和限制条件。若信息不足，说明"牌面不足以支持明确结论"，再给出条件化判断。
3. 只使用用户提供的信息和牌面象征。不要编造人物姓名、对方想法、具体事件、疾病、财务事实或用户未提及的隐私。无法知道的内容，要明确写"无法由牌面确认"。
4. 若问题存在歧义，先给出你采用的最合理解释，并在这个解释下作答，不要反问用户或要求补充信息。

【回答结构】
### 一、直接回应
用 2–4 句话直接回答用户的问题。第一句先给核心结论，随后说明牌面为何支持这个结论。
### 二、逐张牌与牌位的对应
严格按照上面的牌阵顺序逐张回答。每张牌都使用以下结构：
- 牌面与位置：这张牌在该牌位上呈现什么核心状态。
- 问题关联：它具体说明了用户问题中的哪一部分。
- 正逆位差异：只说与当前问题相关的差异，不罗列无关牌义。
- 可核对线索：给出一条用户可以在现实感受、行为或关系中核对的迹象。
### 三、牌与牌之间的关系
指出 2–3 组呼应、矛盾、因果线索或转折，说明它们合在一起后，如何改变对问题的理解。不要逐张重复前面的内容。
### 四、对问题的完整回答
直接回扣用户原问题，给出有层次的结论：已经明确的部分是什么；仍不确定或取决于行动的部分是什么；如果继续当前方向，最值得留意的趋势是什么。若适合回答"倾向/不倾向"，请使用"更偏向……，但并非确定结果"这样的表达。
### 五、接下来 7 天可以做什么
给出 2–3 条具体、低压力、可由用户自主执行的动作。每条都要包含：做什么、在什么情境下做、做完后观察什么。不要使用"顺其自然""相信宇宙""跟随能量"等空泛建议。
### 六、留给用户的一句话
用一句简短、温和的话，帮助用户把注意力带回自己的感受、边界和选择。

【表达要求】
- 使用简体中文和清晰的短段落，重要判断可以用粗体标出。
- 牌面表示的是趋势、心理动力和可观察的可能性，不是注定发生的结果。
- 不制造恐惧，不使用"必然""一定会""命中注定"等绝对化表达，不威胁用户必须采取某种行动。
- 不替代医疗、法律、心理或投资等专业意见；涉及这些领域时，明确建议用户寻求合适的专业支持。
- 不要大段解释塔罗历史或通用牌义；每个判断都要能回到"这与用户的问题有什么关系"。

请直接开始解读。`;
}
function dvCopyPrompt(){
  const tip=document.getElementById('dvCopyTip');

  const done=function(){ tip.textContent='✅ 已复制！粘贴到任意 AI（豆包/DeepSeek/GPT/Claude）即可解读'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(prompt).then(done).catch(function(){
      dvFallbackCopy(prompt); done();
    });
  }else{
    dvFallbackCopy(prompt); done();
  }
}
function dvFallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

async function dvAIInterpret(){
  const out=document.getElementById('dvAIOut');
  const cfg=loadAI();
  if(!cfg.key){
    out.style.display='block';
    out.textContent='⚠️ 还没配 API Key。点右上角「⚙️ AI 配置」填入你的 Key 后再来。';
    return;
  }
  out.style.display='block';
  out.textContent='✨ 星象解读中，请稍候…';
  const q=document.getElementById('dvQ').value.trim()||'（用户未写具体问题）';
  const cardsDesc=dvPicks.map((p,i)=>`${DV_POS[i]}位：${p.card.n}（${p.upr?'正位':'逆位'}）— ${p.upr?p.card.u:(p.card.r||'逆位含义需结合上下文')}`).join('\n');
  const sys=`你是一位温柔、有同理心的韦特塔罗牌师。请根据用户抽出的三张牌和问题，按以下结构输出：

✨逐张解读
每张牌单独一段：牌名（正/逆位）+ 这张牌在这个问题里具体意味着什么，2-3句话，口语化，结合用户处境。

综合结论
分条列出：
✅建议：一句话核心建议
📍重心：该怎么做（具体行动）
💛心态：该保持什么心态
⚠️避雷：不要做什么

💡小总结：一句话总结（进可攻退可守那种）

最后加一句引导：要不要再抽牌看看相关追问？

不要说教不要套话，像朋友聊天一样。`
  const user=`我的问题：${q}\n\n三张牌：\n${cardsDesc}\n\n请结合这三张牌的正逆位，给我一段贴合我处境的解读。`;
  try{
    let r;
    if(cfg.apiType==='anthropic'){
      r=await fetch(cfg.base+'/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({ model:cfg.model, max_tokens:1024, system:sys, messages:[{role:'user',content:user}] })
      });
      if(!r.ok){ const t=await r.text(); throw new Error('HTTP '+r.status+'：'+t.slice(0,200)); }
      const j=await r.json();
      out.textContent=(j.content[0].text||'').trim(); dvSaveHistory(q, dvPicks.map(p=>({n:p.card.n,upr:p.upr})), out.textContent);
    }else{
      r=await fetch(cfg.base+'/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({ model:cfg.model, messages:[{role:'system',content:sys},{role:'user',content:user}], temperature:0.8 })
      });
      if(!r.ok){ const t=await r.text(); throw new Error('HTTP '+r.status+'：'+t.slice(0,200)); }
      const j=await r.json();
      out.textContent=j.choices[0].message.content.trim(); dvSaveHistory(q, dvPicks.map(p=>({n:p.card.n,upr:p.upr})), out.textContent);
    }
  }catch(err){
    out.textContent='⚠️ 调用失败：'+err.message+'\n\n可能原因：1) 接口地址/Key/模型填错；2) 浏览器跨域(CORS)拦截。';
  }
}

function dvExportHist(){

  md += '> 共 ' + h.length + ' 条记录 · 导出时间：' + new Date().toLocaleString('zh-CN') + '\n\n';
  h.forEach(function(item,i){
    md += '---\n\n## ' + (i+1) + '. ' + item.q + '\n\n';
    md += '**时间：** ' + item.time + '\n\n';
    md += '**三张牌：**\n\n';
    item.cards.forEach(function(c,j){
      md += '- ' + DV_POS[j] + '位：' + c.n + '（' + (c.upr?'正位':'逆位') + '）\n';
    });
    md += '\n**AI解读：**\n\n' + item.reading + '\n\n';
  });
  var blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '塔罗历史记录_' + new Date().toISOString().slice(0,10) + '.md';
  a.click();
}
function dvClearHist(){
  if(confirm('确定清空所有历史记录？')){ localStorage.removeItem('tarot_history'); dvShowHistory(); }
}
document.getElementById('dvHistBtn').onclick = dvShowHistory;

</script>
</body>
</html>
